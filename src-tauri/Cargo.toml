[package]
name = "projekt"
version = "0.1.0"
description = "Brainstorming desktop pour développeurs de jeux vidéo"
edition = "2021"

[lib]
name = "projekt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Sauvegarde d'un projet : un seul fichier .zip contenant le JSON fidèle, les
# pages en Markdown et les images.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
